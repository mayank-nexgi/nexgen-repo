<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./assets/css/style.css" />
    <link rel="shortcut icon" href="./assets/logo/icon.png" type="image/x-icon">
    <title>Strategy & Engineering</title>
  </head>
  <body>
    <section class="hero-section">
      <div class="hero-section__container">
        <!-- Heading & Description -->
        <h1 class="hero-section__title">Helping businesses grow better.</h1>
        <p class="hero-section__description">
          Our tailored eCommerce solutions and data-driven strategies drive
          sales and enhance customer engagement. Harness automation,
          personalization, and analytics to streamline operations and foster
          lasting relationships.
        </p>
        <!-- Partner Logos  -->
        <div class="hero-section__partners">
          <ul class="hero-section__logo">
            <li><img class="hero-section__image" src="./assets/logo/clutch.png" alt=""></li>
            <li><img class="hero-section__image" src="./assets/logo/codeable.png" alt=""></li>
            <li><img class="hero-section__image" src="./assets/logo/facebook.png" alt=""></li>
            <li><img class="hero-section__image" src="./assets/logo/goodfirms.png" alt=""></li>
            <li><img class="hero-section__image" src="./assets/logo/google.png" alt=""></li>
          </ul>
        </div>
        <!-- Request a callback Button -->
        <div class="hero-section__action">
          <button class="btn btn--primary">Request a callback</button>
        </div>
      </div>
    </section>
  </body>
</html>
